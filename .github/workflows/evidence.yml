name: Research evidence integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate Python syntax and JSON files
        run: |
          python -m compileall -q src scripts
          python -m json.tool protocol.json > /dev/null
          python -m json.tool results/statistics.json > /dev/null
          python -m json.tool results/full_reproduction_validation.json > /dev/null
      - name: Validate recorded experimental evidence
        run: |
          python scripts/verify_evidence.py > evidence-report.json
          cat evidence-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-consistency-report
          path: evidence-report.json
      - name: Install browser test dependency
        run: python -m pip install playwright==1.56.0
      - name: Check evidence validation and dashboard
        run: |
          python -m unittest discover -s tests -v
          python tests/browser_smoke.py
